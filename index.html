<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plaza Studio</title><meta name="description" content="Build, script and play 3D worlds together in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/plaza.css"></head>
<body class="menu"><div id="app">
<div id="rib"><button id="bf" class="file">☰ FILE</button><div id="tabs"><button data-p="home" class="on">HOME</button><button data-p="model">MODEL</button><button data-p="view">VIEW</button><button data-p="test">TEST</button></div><input id="fi" type="file" hidden></div>
<div id="panel"><div class="pp" data-p="home"><div class="g" id="tools"><button data-t="select" class="on">⬉ Select</button><button data-t="move">✥ Move</button><button data-t="scale">⤡ Scale</button><button data-t="rotate">⟳ Rotate</button></div>
<div class="g"><button id="bi">＋ Part</button><button id="bc">⧉ Copy</button><button id="bv">📋 Paste</button><button id="bu">Duplicate</button><button id="bd">🗑 Delete</button></div><div class="g"><button id="bm">☑ Multi</button></div></div>
<div class="pp hide" data-p="model"><div class="g"><button id="bo2">＋ Insert Object</button></div><div class="g"><button id="bun">🧊 Union</button><button id="bneg">➖ Negate</button><button id="bint">✂ Intersect</button><button id="bsep">↔ Separate</button></div><div class="g"><button id="bw">🔗 Weld</button></div></div>
<div class="pp hide" data-p="view"><div class="g"><button id="vq">Explorer</button><button id="vp2">Properties</button><button id="vo">Output</button></div></div>
<div class="pp hide" data-p="test"><div class="g"><button class="pl" id="bp">▶ Play</button><button class="st" id="bx">■ Stop</button></div><div class="g"><button id="bmp">🌐 Multiplayer: Off</button><input id="room" maxlength="12" placeholder="ROOM" title="Room code"></div><div class="g"><button id="bav">🧑 Avatar</button><button id="bpub">🚀 Publish</button></div></div></div>
<div id="main"><div id="vp"><canvas id="cv"></canvas><div id="gui"></div><div id="hud"></div>
<div id="joy"><div id="knob"></div></div><div id="jb">⤒</div><div id="jd">⤓</div>
<div id="ed"><button id="ec">✕ Close script</button><textarea id="ea" spellcheck="false"></textarea></div><button id="play-exit">↩ Exit Play Mode</button>
<div id="chat"><div id="ch"><span id="pc">👥 1</span><span id="em"><button data-e="wave" title="Wave">👋</button><button data-e="dance" title="Dance">💃</button><button data-e="cheer" title="Cheer">🙌</button></span></div><div id="cl"></div><div id="cb"><input id="ci" maxlength="120" placeholder="Press Enter to chat…" autocomplete="off"><button id="cs">➤</button></div></div>
<div id="st"><div class="blobs"></div><header class="hero"><div class="logo">PLAZA</div><p>Build worlds. Script them. Play together.</p></header>
<div class="project-tabs"><button id="play-tab">▶ Play</button><button id="templates-tab" class="on">✨ Create</button><button id="saved-tab">📁 My Projects</button><button id="avatar-tab">🧑 Avatar</button><button id="online-tab">🌐 Multiplayer</button></div>
<div id="template-view" class="hv"><div class="card" data-k="base"><b>🟦</b>Baseplate</div><div class="card" data-k="terr"><b>⛰️</b>Terrain</div><div class="card" id="so"><b>📂</b>Open file…</div></div>
<div id="saved-view" class="hv hide"><div id="saved-project-list"></div></div>
<div id="avatar-view" class="hv hide"></div><div id="online-view" class="hv hide"></div><div id="pub-view" class="hv hide"></div></div></div>
<div id="rc"><div id="ex" class="pn"><div class="ph">Explorer</div><div class="bd"></div></div>
<div id="pr" class="pn"><div class="ph">Properties</div><div class="bd"></div></div></div></div>
<div id="out"></div><input id="cmd" placeholder="Run a command (Lua)"><div id="menu" class="hide"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
<script src="js/plaza.js"></script><script src="js/csg.js"></script><script src="js/avatar.js"></script><script src="js/net.js"></script><script src="js/ui.js"></script><script src="js/gizmo.js"></script><script src="js/main.js"></script><script src="js/home.js"></script></body></html>
